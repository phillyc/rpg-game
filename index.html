<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Don't Have It</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: #f8f8f8;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 4px;
            justify-content: flex-start;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            padding: 0 16px;
            padding-top: 20px;
            padding-bottom: 12px;
            margin: 0 auto;
        }

        /* Hamburger Menu */
        .hamburger-menu {
            position: absolute;
            top: 20px;
            right: 16px;
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 5px;
            z-index: 1001;
        }

        .hamburger-line {
            width: 24px;
            height: 3px;
            background-color: #333;
            border-radius: 2px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .hamburger-menu.active .hamburger-line:nth-child(1) {
            transform: translateY(8px) rotate(45deg);
        }

        .hamburger-menu.active .hamburger-line:nth-child(2) {
            opacity: 0;
            transform: translateX(-10px);
        }

        .hamburger-menu.active .hamburger-line:nth-child(3) {
            transform: translateY(-8px) rotate(-45deg);
        }

        .nav-menu {
            position: absolute;
            top: 70px;
            right: 16px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            padding: 12px;
            display: none;
            flex-direction: column;
            gap: 8px;
            min-width: 180px;
            z-index: 1001;
        }

        .nav-menu.active {
            display: flex;
        }

        .nav-menu button {
            background-color: #f0f0f0;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #333;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            text-align: left;
        }

        .nav-menu button:hover {
            background-color: #e0e0e0;
            transform: translateX(4px);
        }

        .nav-menu button:active {
            transform: translateX(2px);
        }

        @media (max-width: 768px) {
            .hamburger-menu {
                display: flex;
            }

            header h1,
            header p {
                display: none;
            }
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #333;
            margin: 0;
        }

        header p {
            font-size: 0.875rem;
            font-weight: 400;
            color: #666;
            margin: 0;
            line-height: 1.4;
        }

        .container {
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 16px;
            min-height: calc(100vh - 60px);
        }

        .row {
            display: flex;
            justify-content: center;
            gap: 16px;
            align-items: center;
        }

        .person {
            width: 56px;
            height: 56px;
            background-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            user-select: none;
        }

        .person.rare {
            filter: drop-shadow(0 0 2px rgba(255, 0, 0, 0.5));
            cursor: pointer;
        }

        .person:hover {
            transform: scale(1.1);
            transition: transform 0.15s ease;
        }

        .person.rare:hover {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1.1); }
            50% { transform: scale(1.2); }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background-color: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 90%;
            width: 420px;
            text-align: center;
        }

        .modal h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #333;
        }

        .modal p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .modal button {
            background-color: black;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .modal button:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <header>
        <div class="hamburger-menu" id="hamburger">
            <div class="hamburger-line"></div>
            <div class="hamburger-line"></div>
            <div class="hamburger-line"></div>
        </div>
        <nav class="nav-menu" id="navMenu">
            <button id="nav-home">🏠 Home</button>
            <button id="nav-about">ℹ️ About</button>
            <button id="nav-test1">🧪 Test 1</button>
            <button id="nav-test2">🧪 Test 2</button>
            <button id="nav-test3">🧪 Test 3</button>
        </nav>
        <h1>You don't have it</h1>
        <p>1 in 10,000 people is a very rare number. We hope this visualization helps reassure you of that fact.</p>
    </header>

    <div class="container" id="container"></div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2>This is so rare, look how far you had to scroll!</h2>
            <p>You found the rare red person after scrolling <span id="scroll-count" style="font-weight: 700; color: #333;">0</span> rows.</p>
            <button id="close-modal">Awesome</button>
        </div>
    </div>

    <script>
        const PEOPLE_PER_ROW = 5;
        const RARE_CHANCE = 1 / 10000; // 1 in 10,000
        const CHUNK_SIZE = 100;
        const SCROLL_THRESHOLD = 300;

        const CONTAINER = document.getElementById('container');
        const MODAL = document.getElementById('modal');
        const CLOSE_MODAL = document.getElementById('close-modal');
        const SCROLL_COUNT_SPAN = document.getElementById('scroll-count');
        const HAMBURGER = document.getElementById('hamburger');
        const NAV_MENU = document.getElementById('navMenu');
        const NAV_HOME = document.getElementById('nav-home');
        const NAV_ABOUT = document.getElementById('nav-about');
        const NAV_TEST1 = document.getElementById('nav-test1');
        const NAV_TEST2 = document.getElementById('nav-test2');
        const NAV_TEST3 = document.getElementById('nav-test3');

        let totalRows = 0;
        let scrollCount = 0;
        let rareFound = false;

        // Hamburger menu toggle
        HAMBURGER.addEventListener('click', () => {
            HAMBURGER.classList.toggle('active');
            NAV_MENU.classList.toggle('active');
        });

        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!HAMBURGER.contains(e.target) && !NAV_MENU.contains(e.target)) {
                HAMBURGER.classList.remove('active');
                NAV_MENU.classList.remove('active');
            }
        });

        // Navigation test buttons
        NAV_HOME.addEventListener('click', () => alert('🏠 Home clicked!'));
        NAV_ABOUT.addEventListener('click', () => alert('ℹ️ About clicked!'));
        NAV_TEST1.addEventListener('click', () => alert('🧪 Test 1 clicked!'));
        NAV_TEST2.addEventListener('click', () => alert('🧪 Test 2 clicked!'));
        NAV_TEST3.addEventListener('click', () => alert('🧪 Test 3 clicked!'));

        // Configuration for testing
        const TESTING_MODE = true; // Set to false for normal deployment
        const TEST_RARE_ROW = 0;   // Which row (0-indexed) to make rare
        const TEST_RARE_POS = 4;   // Which position (0-4) to make rare

        function createRow() {
            const row = document.createElement('div');
            row.className = 'row';
            
            for (let i = 0; i < PEOPLE_PER_ROW; i++) {
                // Force rare for testing
                const isRare = TESTING_MODE && totalRows === TEST_RARE_ROW && i === TEST_RARE_POS
                    ? true
                    : Math.random() < RARE_CHANCE;
                
                const person = document.createElement('div');
                person.className = 'person' + (isRare ? ' rare' : '');
                // Show stop sign for rare person, people emoji for regular
                person.textContent = isRare ? '🛑' : '🚹';
                person.dataset.isRare = isRare;
                person.dataset.position = i;
                
                if (isRare) {
                    person.addEventListener('click', () => {
                        if (!rareFound) {
                            rareFound = true;
                            showRareModal();
                        }
                    });
                }
                
                row.appendChild(person);
            }
            
            return row;
        }

        function addRows(count) {
            for (let i = 0; i < count; i++) {
                const row = createRow();
                CONTAINER.appendChild(row);
                totalRows++;
            }
        }

        function showRareModal() {
            if (totalRows > 0) {
                scrollCount = totalRows;
            }
            SCROLL_COUNT_SPAN.textContent = scrollCount.toLocaleString();
            MODAL.classList.add('active');
        }

        function hideModal() {
            MODAL.classList.remove('active');
            // Reset rareFound flag so modal can appear again
            rareFound = false;
        }

        CLOSE_MODAL.addEventListener('click', hideModal);
        MODAL.addEventListener('click', (e) => {
            if (e.target === MODAL) {
                hideModal();
            }
        });

        function checkScroll() {
            const scrollPosition = window.innerHeight + window.scrollY;
            if (scrollPosition >= document.body.offsetHeight - SCROLL_THRESHOLD) {
                addRows(CHUNK_SIZE);
            }
        }

        window.addEventListener('scroll', checkScroll);

        // Initial rows
        addRows(CHUNK_SIZE);
    </script>
</body>
</html>
